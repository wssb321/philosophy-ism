<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="用中立、简明的语言理解不同哲学传统。">
  <title>主义百科｜哲学主义</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
<script defer src="/_vercel/insights/script.js"></script></head>
<body class="lexicon-page">
  <main>
    <header class="container page-intro lexicon-intro">
      <p class="eyebrow">思想索引 · 42 个词条</p>
      <h1>主义百科</h1>
      <p>用中立、简明的语言理解不同思想传统。每个词条既提供定义、核心主张与概念区分，也附有一份通俗版讲解：一句话说清、举个例子、它主张什么、容易和谁搞混。</p>
    </header>
    <section class="container lexicon-toolbar" aria-label="百科筛选">
      <label><span>搜索词条</span><input class="form-control" type="search" data-lexicon-search placeholder="输入主义、概念或关键词"></label>
      <label><span>分类</span><select class="form-control" data-lexicon-category><option value="all">全部分类</option></select></label>
    </section>
    <aside class="container notice metaphysics-note"><strong>关于“形而上学”：</strong>本站所使用的“形而上学”为西方哲学本义（研究存在、本质、实在的基础哲学学科），并非马克思主义哲学中“孤立、静止、片面的思维方式”定义，二者无关。</aside>
    <section class="container lexicon-list" data-lexicon-list aria-live="polite"></section>
    <p class="container empty-state" data-lexicon-empty hidden>没有找到相关词条，请尝试其他关键词或分类。</p>
  </main>
  <script type="module" src="assets/js/site.js"></script>
  <script type="module" src="assets/js/lexicon.js"></script>
</body>
</html>
