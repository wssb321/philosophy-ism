<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>首页设计对照</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#222;color:#fff;font:14px/1.4 system-ui,sans-serif}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.panel{min-width:0}.label{margin:0 0 8px;color:#ddd}.frame{width:100%;aspect-ratio:3/2;border:1px solid #555;background:#fff;overflow:hidden}.frame img{display:block;width:100%;height:100%;object-fit:contain}.frame iframe{width:200%;height:200%;border:0;transform:scale(.5);transform-origin:0 0}@media(max-width:900px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="grid">
    <section class="panel"><p class="label">参考图 · 1536 × 1024</p><div class="frame"><img src="homepage-reference.png" alt="用户提供的首页参考图"></div></section>
    <section class="panel"><p class="label">实现 · 1536 × 1024 等比缩放</p><div class="frame"><iframe src="../../index.html" title="实现页面"></iframe></div></section>
  </main>
</body>
</html>
